<style>
:root,
:root[data-theme="blue"]{
  --bg:#F2F4FA;
  --bg-soft:#FFFFFF;
  --surface:#FFFFFF;
  --surface-2:#F0F3F9;
  --card:#FFFFFF;
  --line:rgba(20,30,60,0.09);
  --line-soft:rgba(20,30,60,0.055);
  --ink:#151B2C;
  --ink-soft:#5B6684;
  --ink-faint:#8C96B4;
  --accent:#3654CE;
  --accent-2:#4C82F2;
  --accent-soft:rgba(54,84,206,0.11);
  --teal:#0EA88C;
  --teal-soft:rgba(14,168,140,0.12);
  --warn:#C9820F;
  --warn-soft:rgba(201,130,15,0.12);
  --danger:#E23B54;
  --danger-soft:rgba(226,59,84,0.10);
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 24px 56px -22px rgba(20,30,60,0.22);
  --shadow-sm:0 8px 22px -10px rgba(20,30,60,0.13);
  --ease:cubic-bezier(.4,0,.2,1);
}
/* ---------- COLOR THEME VARIANTS ----------
   These layer on top of the base :root (Blue) block above, overriding
   only the accent colors, so every other token (surfaces, spacing,
   shadows, status colors) stays consistent and the switch feels
   instant and smooth via the global transition rules. */
:root[data-theme="light"]{
  --accent:#48566B;
  --accent-2:#6B7A90;
  --accent-soft:rgba(72,86,107,0.11);
}
:root[data-theme="orange"]{
  --accent:#D9790C;
  --accent-2:#F2A238;
  --accent-soft:rgba(217,121,12,0.13);
}
:root[data-theme="red"]{
  --accent:#D63A57;
  --accent-2:#EC6B84;
  --accent-soft:rgba(214,58,87,0.12);
}
:root[data-theme="yellow"]{
  --accent:#B4841C;
  --accent-2:#DBA847;
  --accent-soft:rgba(180,132,28,0.15);
}
:root[data-theme="green"]{
  --accent:#12996F;
  --accent-2:#2FBB93;
  --accent-soft:rgba(18,153,111,0.13);
}

:root[data-theme="dark"]{
  --bg:#0B1220;
  --bg-soft:#0F1830;
  --surface:#101a30;
  --surface-2:#0c1526;
  --card:#111d38;
  --line:rgba(255,255,255,0.08);
  --line-soft:rgba(255,255,255,0.05);
  --ink:#EAF0FF;
  --ink-soft:#96A3C4;
  --ink-faint:#5F6D91;
  --accent:#4C82F2;
  --accent-2:#8A6BFB;
  --accent-soft:rgba(76,130,242,0.16);
  --teal:#19C3A6;
  --teal-soft:rgba(25,195,166,0.14);
  --warn:#F2B23C;
  --warn-soft:rgba(242,178,60,0.14);
  --danger:#F2495C;
  --danger-soft:rgba(242,73,92,0.14);
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 24px 56px -22px rgba(0,0,0,0.55);
  --shadow-sm:0 8px 22px -10px rgba(0,0,0,0.42);
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;}
html{transition:background-color .4s var(--ease);}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1100px 700px at 12% -10%, var(--accent-soft), transparent 55%),
    radial-gradient(900px 600px at 110% 10%, rgba(124,92,250,0.10), transparent 55%),
    var(--bg);
  background:
    radial-gradient(1100px 700px at 12% -10%, var(--accent-soft), transparent 55%),
    radial-gradient(900px 600px at 110% 10%, color-mix(in srgb, var(--accent-2) 14%, transparent), transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  font-optical-sizing:auto;
  letter-spacing:-0.001em;
  transition:background-color .4s var(--ease), color .4s var(--ease);
}
h1,h2,h3,h4{font-family:'Manrope',sans-serif;font-weight:800;margin:0;color:var(--ink);letter-spacing:-0.018em;line-height:1.2;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--ink-faint);opacity:.5;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
[hidden]{display:none !important;}
button:focus-visible, a:focus-visible, .sb-link:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
* {
  transition:
    background-color .32s var(--ease),
    border-color .32s var(--ease),
    color .32s var(--ease),
    box-shadow .22s var(--ease),
    transform .2s cubic-bezier(.34,1.56,.64,1);
}


/* ---------- BOOT ---------- */
#bootScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
.boot-mark{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent-2));position:relative;overflow:hidden;box-shadow:0 12px 30px -8px rgba(46,86,214,0.55);animation:pulse 1.8s ease-in-out infinite;display:flex;align-items:center;justify-content:center;padding:9px;}
.boot-mark img{width:100%;height:100%;object-fit:contain;border-radius:8px;background:#fff;padding:4px;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
.boot-mark:before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent,rgba(255,255,255,.55),transparent);animation:sheen 1.4s infinite;z-index:1;pointer-events:none;}
@keyframes sheen{from{transform:translateX(-120%);}to{transform:translateX(120%);}}
.boot-text{font-family:'Manrope',sans-serif;font-weight:700;color:var(--ink-soft);font-size:13px;letter-spacing:.06em;text-transform:uppercase;}

/* ---------- WATERMARK ---------- */
.app-watermark{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;opacity:.05;mix-blend-mode:multiply;transition:opacity .4s ease;}
.app-watermark img{width:38vw;max-width:520px;min-width:240px;}
:root[data-theme="dark"] .app-watermark{opacity:.07;mix-blend-mode:screen;filter:grayscale(1) invert(1) brightness(1.3);}
#app{position:relative;z-index:1;}
#authScreen{position:relative;z-index:1;}

/* ---------- AUTH ---------- */
#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-card{width:100%;max-width:420px;background:linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.015));border:1px solid var(--line);border-radius:20px;padding:38px 34px;box-shadow:var(--shadow);backdrop-filter:blur(20px);animation:riseIn .5s cubic-bezier(.2,.8,.2,1);}
@keyframes riseIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.brand .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));flex:none;position:relative;box-shadow:0 8px 20px -6px rgba(46,86,214,0.5);overflow:hidden;display:flex;align-items:center;justify-content:center;padding:5px;}
.brand .mark img{width:100%;height:100%;object-fit:contain;border-radius:6px;background:#fff;padding:2px;}
.brand h1{font-size:22px;}
.brand-sub{color:var(--ink-faint);font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;margin-bottom:26px;}
.auth-sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:22px;line-height:1.6;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:7px;font-weight:700;}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-family:'Inter',sans-serif;font-size:14.5px;background:rgba(255,255,255,0.03);color:var(--ink);}
.field input::placeholder{color:var(--ink-faint);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3.5px var(--accent-soft);}
.field textarea{resize:vertical;min-height:76px;}
.field-hint{font-size:12px;color:var(--ink-faint);margin-top:6px;line-height:1.5;}
.field-error{color:var(--danger);font-size:12.5px;margin-top:10px;display:flex;align-items:center;gap:6px;background:var(--danger-soft);padding:9px 12px;border-radius:10px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:var(--radius-sm);border:1.5px solid transparent;font-size:14px;font-weight:700;white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;width:100%;box-shadow:0 12px 26px -10px rgba(62,123,250,0.55);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 16px 30px -8px rgba(62,123,250,0.6);}
.btn-primary:active{transform:translateY(0);}
.btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--line);}
.btn-ghost:hover{border-color:var(--ink-faint);color:var(--ink);background:rgba(255,255,255,0.03);}
.btn-outline{background:rgba(62,123,250,0.06);color:var(--accent);border-color:rgba(62,123,250,0.35);}
.btn-outline:hover{background:var(--accent-soft);border-color:var(--accent);}
.btn-danger{background:transparent;color:var(--danger);border-color:rgba(242,73,92,0.35);}
.btn-danger:hover{background:var(--danger-soft);}
.btn-sm{padding:8px 13px;font-size:12.5px;}
.btn[disabled]{opacity:.55;cursor:not-allowed;}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.auth-foot{margin-top:20px;text-align:center;font-size:12.5px;color:var(--ink-faint);}
.id-badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:3px 9px;font-size:11.5px;font-weight:700;font-family:'IBM Plex Mono',monospace;}

/* ---------- APP SHELL ---------- */
#app{display:flex;min-height:100vh;}
.sidebar{width:264px;flex:none;background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;box-shadow:6px 0 24px -18px rgba(20,30,60,0.25);}
.sb-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px;margin-bottom:6px;border-bottom:1px solid var(--line-soft);}
.sb-brand .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));flex:none;position:relative;box-shadow:0 8px 18px -6px rgba(46,86,214,0.5);overflow:hidden;display:flex;align-items:center;justify-content:center;padding:4px;}
.sb-brand .mark img{width:100%;height:100%;object-fit:contain;border-radius:5px;background:#fff;padding:2px;}
.sb-brand-txt{font-family:'Manrope',sans-serif;font-weight:800;font-size:15.5px;}
.sb-brand-sub{font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;font-weight:700;}
.sb-section{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint);font-weight:700;margin:16px 10px 8px;}
.sb-nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto;}
.sb-link{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--ink-soft);font-size:13.8px;font-weight:600;cursor:pointer;position:relative;transition:background .15s ease,color .15s ease,transform .15s ease;}
.sb-link:hover{background:rgba(255,255,255,0.05);color:var(--ink);transform:translateX(1px);}
.sb-link.active{background:linear-gradient(135deg, rgba(62,123,250,0.18), rgba(124,92,250,0.14));color:#fff;box-shadow:inset 0 0 0 1px rgba(62,123,250,0.35);}
.sb-link.active:before{content:'';position:absolute;left:-16px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 4px 4px 0;background:linear-gradient(180deg,var(--accent),var(--accent-2));}
.sb-link .ic{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;opacity:.9;}
.sb-link .ic svg{width:18px;height:18px;display:block;}
.field-error svg{width:15px;height:15px;flex:none;}
.tab-chip svg{width:14px;height:14px;flex:none;}
.sb-link .cnt{margin-left:auto;background:rgba(255,255,255,0.08);color:var(--ink-soft);font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:20px;}
.sb-link.active .cnt{background:rgba(255,255,255,0.18);color:#fff;}
.sb-foot{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;}
.sb-avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--teal),#0f8f79);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#04241f;flex:none;}
.sb-user-name{font-size:13px;font-weight:700;color:var(--ink);}
.sb-user-role{font-size:11px;color:var(--ink-faint);}
.sb-signout{width:100%;margin-top:8px;}

/* ---------- SIDEBAR NAV ----------
   Always rendered as a normal, permanently-visible left column —
   this workspace is a desktop application and the layout no longer
   collapses into an off-canvas drawer at any width. */

.main{flex:1;min-width:0;padding:30px 40px 60px;max-width:1360px;}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:800;margin-bottom:6px;}
.topbar h2{font-size:24px;letter-spacing:-0.015em;}
.topbar-sub{color:var(--ink-soft);font-size:13.5px;margin-top:6px;}
.topbar-actions{display:flex;gap:10px;flex-wrap:wrap;}

/* ---------- CREATE FAB (merged "New customer" / "New task" launcher) ----------
   Floats fixed in the top-right corner, stacked a little below the
   dark/light theme toggle so the two round controls don't crowd each other. */
.fab-create{position:fixed; top:74px; right:16px; z-index:480;}
.fab-main{
  width:42px;height:42px;border-radius:12px;flex:none;
  position:relative; z-index:521;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;border:none;cursor:pointer;
  box-shadow:0 10px 22px -8px rgba(46,86,214,0.55);
  transition:transform .28s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease, border-radius .25s ease;
}
.fab-main:hover{box-shadow:0 12px 26px -8px rgba(46,86,214,0.65);}
.fab-main:active{transform:scale(0.92);}
.fab-main svg{width:19px;height:19px;display:block;transition:transform .3s cubic-bezier(.4,0,.2,1);}
.fab-create.open .fab-main{transform:rotate(45deg);border-radius:50%;}
.fab-menu{
  position:absolute; top:calc(100% + 10px); right:0; z-index:520;
  min-width:190px; padding:8px; border-radius:14px;
  background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:2px;
  opacity:0; visibility:hidden; pointer-events:none;
  transform:translateY(-8px) scale(0.96); transform-origin:top right;
  transition:opacity .2s ease, transform .22s cubic-bezier(.2,.85,.25,1), visibility .2s;
}
.fab-create.open .fab-menu{opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0) scale(1);}
.fab-option{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;background:transparent;border:none;
  text-align:left;width:100%;transition:background .15s ease,color .15s ease;
}
.fab-option:hover{background:var(--accent-soft);color:var(--accent);}
.fab-option .fab-ic{width:28px;height:28px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent);}
.fab-option .fab-ic svg{width:15px;height:15px;display:block;}
.fab-scrim{display:none;}
.fab-create.open .fab-scrim{display:block;position:fixed;inset:0;z-index:510;background:transparent;}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:24px;}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:transform .2s ease, box-shadow .2s ease;}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.stat-card:before{content:'';position:absolute;right:-20px;top:-20px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle, var(--accent-soft), transparent 70%);}
.stat-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;position:relative;}
.stat-icon{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--accent-soft);color:var(--accent);}
.stat-icon svg{width:18px;height:18px;display:block;}
.stat-icon.teal{background:var(--teal-soft);color:var(--teal);}
.stat-icon.warn{background:var(--warn-soft);color:var(--warn);}
.stat-icon.danger{background:var(--danger-soft);color:var(--danger);}
.stat-label{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:10px;position:relative;}
.stat-card .stat-top + .stat-value{margin-bottom:0;}
.stat-value{font-size:28px;font-family:'Manrope',sans-serif;font-weight:800;position:relative;}
.stat-delta{font-size:12px;margin-top:8px;color:var(--teal);font-weight:600;position:relative;}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:18px;box-shadow:var(--shadow-sm);overflow:hidden;}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line-soft);gap:10px;flex-wrap:wrap;}
.panel-head h3{font-size:15.5px;letter-spacing:-0.01em;}
.panel-body{padding:4px 0;}
.panel-body.pad{padding:20px;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;padding:11px 20px;color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:13px 20px;border-bottom:1px solid var(--line-soft);color:var(--ink);}
tr.clickable{cursor:pointer;}
tr.clickable:hover td{background:rgba(255,255,255,0.025);}
.empty-row td{text-align:center;color:var(--ink-faint);padding:34px 20px;}
.empty-state{text-align:center;padding:60px 20px;color:var(--ink-faint);}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
.badge-new{background:var(--accent-soft);color:var(--accent);}
.badge-role{background:var(--teal-soft);color:var(--teal);text-transform:capitalize;}
.st-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700;text-transform:capitalize;}
.st-active,.st-approved,.st-completed{background:var(--teal-soft);color:var(--teal);}
.st-pending,.st-under_review,.st-assigned{background:var(--warn-soft);color:var(--warn);}
.st-inactive,.st-rejected{background:var(--danger-soft);color:var(--danger);}
.st-in_progress,.st-ready_for_review{background:var(--accent-soft);color:var(--accent);}
.priority-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;}
.pr-low{background:var(--teal);} .pr-medium{background:var(--warn);} .pr-high{background:var(--danger);}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.field-group-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:800;margin:22px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);}
.cf-details{margin:14px 0;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);overflow:hidden;}
.cf-details summary{list-style:none;cursor:pointer;user-select:none;padding:12px 14px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);font-weight:800;display:flex;align-items:center;gap:8px;}
.cf-details summary::-webkit-details-marker{display:none;}
.cf-details summary:before{content:'▸';color:var(--accent);display:inline-block;transition:transform .18s ease;font-size:11px;}
.cf-details[open] summary:before{transform:rotate(90deg);}
.cf-details[open] summary{border-bottom:1px solid var(--line);}
.cf-details .cf-details-body{padding:14px;}
.cf-details-count{margin-left:auto;font-weight:700;color:var(--ink-faint);text-transform:none;letter-spacing:0;font-size:11px;}
.divider{height:1px;background:var(--line);margin:20px 0;}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;}
.detail-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:700;margin-bottom:5px;}
.detail-value{font-size:14.5px;color:var(--ink);font-weight:500;}
.info-banner{background:var(--accent-soft);color:var(--accent);padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;}
.progress-track{height:8px;background:rgba(255,255,255,0.06);border-radius:20px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--teal));border-radius:20px;transition:width .5s ease;}

.stepper{display:flex;align-items:flex-start;margin-bottom:22px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 18px;overflow-x:auto;}
.step{flex:1;min-width:100px;position:relative;text-align:center;}
.step .connector{position:absolute;top:14px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0;}
.step:first-child .connector{display:none;}
.step.done .connector{background:var(--teal);}
.node{width:28px;height:28px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:12px;font-weight:800;color:var(--ink-faint);position:relative;z-index:1;}
.step.done .node{background:var(--teal);border-color:var(--teal);color:#04241f;}
.step.current .node{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 5px var(--accent-soft);}
.step-label{font-size:11px;color:var(--ink-faint);font-weight:600;}
.step.current .step-label,.step.done .step-label{color:var(--ink);}
.rejected-stamp{background:var(--danger-soft);color:var(--danger);padding:14px 18px;border-radius:12px;font-weight:800;letter-spacing:.03em;margin-bottom:18px;font-size:13px;}

.card-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:18px 20px;}
.mini-card{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;}
.mini-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.mini-card-title{font-weight:700;font-size:14.5px;margin-bottom:4px;}
.mini-card-sub{font-size:12px;color:var(--ink-faint);margin-bottom:10px;}

.doc-row{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line-soft);}
.doc-ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none;font-size:11px;font-weight:800;}
.doc-name{font-weight:600;font-size:13.5px;}
.doc-meta{font-size:11.5px;color:var(--ink-faint);}
.doc-actions{margin-left:auto;display:flex;gap:8px;}

.modal-overlay{position:fixed;inset:0;background:rgba(5,9,20,0.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:24px;}
.modal{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);animation:riseIn .3s ease;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);}
.modal-close{background:transparent;border:none;color:var(--ink-faint);font-size:16px;padding:4px 8px;border-radius:8px;}
.modal-close:hover{background:rgba(255,255,255,0.06);color:var(--ink);}
.modal-body{padding:22px;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line);}

.toast-wrap{position:fixed;top:20px;right:20px;z-index:400;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--teal);padding:13px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);min-width:240px;animation:riseIn .25s ease;}
.toast.err{border-left-color:var(--danger);}

.upload-zone{border:1.5px dashed var(--line);border-radius:14px;padding:26px;text-align:center;background:rgba(255,255,255,0.02);}
.upload-zone.dragover{border-color:var(--accent);background:var(--accent-soft);}

.progress-ring{width:64px;height:64px;flex:none;}
.progress-ring svg{width:64px;height:64px;transform:rotate(-90deg);}
.progress-ring .track{fill:none;stroke:rgba(255,255,255,0.08);stroke-width:6;}
.progress-ring .fill{fill:none;stroke:var(--teal);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .6s ease;}

/* ---------- THEME TOGGLE ---------- */
.theme-toggle{
  position:fixed; top:16px; right:16px; z-index:500;
  width:46px; height:46px; border-radius:50%;
  background:var(--card); border:1.5px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow-sm); line-height:1;
  color:var(--ink);
}
.theme-toggle:hover{ transform:translateY(-2px) rotate(-8deg); box-shadow:var(--shadow); border-color:var(--accent); }
.theme-toggle:active{ transform:translateY(0) scale(0.94); }
.theme-toggle svg{width:20px;height:20px;display:block;}

/* ---------- NOTIFICATIONS ---------- */
.notif-btn{position:relative;width:38px;height:38px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex:none;}
.notif-btn:hover{color:var(--ink);border-color:var(--accent);}
.notif-btn svg{width:17px;height:17px;display:block;}
.notif-dot{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;padding:0 3px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);}
.notif-panel{position:absolute;top:calc(100% + 10px);right:0;width:360px;max-height:70vh;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:600;animation:riseIn .2s ease;}
.notif-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line-soft);}
.notif-head h4{font-size:13.5px;}
.notif-item{padding:12px 16px;border-bottom:1px solid var(--line-soft);cursor:pointer;display:flex;gap:10px;align-items:flex-start;}
.notif-item:last-child{border-bottom:none;}
.notif-item:hover{background:var(--surface-2);}
.notif-item.unread{background:var(--accent-soft);}
.notif-ic{width:30px;height:30px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent);}
.notif-ic svg{width:15px;height:15px;}
.notif-text{font-size:12.5px;color:var(--ink);line-height:1.45;}
.notif-time{font-size:10.5px;color:var(--ink-faint);margin-top:3px;}
.notif-empty{padding:30px 16px;text-align:center;color:var(--ink-faint);font-size:12.5px;}
.expiry-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft);}
.expiry-item:last-child{border-bottom:none;}
.expiry-badge{font-size:11px;font-weight:800;padding:4px 9px;border-radius:20px;flex:none;}
.expiry-badge.soon{background:var(--danger-soft);color:var(--danger);}
.expiry-badge.upcoming{background:var(--warn-soft);color:var(--warn);}

/* ---------- SETTINGS / THEME SWATCHES ---------- */
.swatch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;}
.swatch-card{position:relative;display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface-2);cursor:pointer;overflow:hidden;}
.swatch-card:hover{border-color:var(--ink-faint);transform:translateY(-2px);box-shadow:var(--shadow-sm);}
.swatch-card.active{border-color:var(--accent);box-shadow:0 0 0 3.5px var(--accent-soft), var(--shadow-sm);background:var(--accent-soft);}
.swatch-dot{width:30px;height:30px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,0.55);box-shadow:0 3px 10px -3px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(0,0,0,0.06);}
.swatch-name{font-size:13.5px;font-weight:700;color:var(--ink);}
.swatch-check{position:absolute;top:9px;right:9px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px -1px rgba(0,0,0,0.3);}
.swatch-check svg{width:11px;height:11px;display:block;}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-soft);}
.settings-row:last-child{border-bottom:none;}
.tab-chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
.tab-chip:hover{color:var(--ink);border-color:var(--accent);}
</style>
</head>

const cloudFunctions = getFunctions(app); // default region: us-central1 — change with getFunctions(app,'your-region') if needed
const deleteUserAuthAccountFn = httpsCallable(cloudFunctions, 'deleteUserAccount');

// Calls the deleteUserAccount Cloud Function so the login can be fully freed up
// (same ID reusable for a different customer/employee afterwards). If the
// function hasn't been deployed yet, this fails gracefully and the app still
// removes the Realtime Database records as before — it just warns that the
// Authentication account itself needs deploying/removing manually.
async function deleteAuthAccount(uidToDelete){
  try{
    await deleteUserAuthAccountFn({ uid: uidToDelete });
    return true;
  }catch(e){
    console.error('deleteUserAccount function failed:', e);
    toast('Database records removed, but could not delete the Authentication login automatically (deploy the Cloud Function — see functions/index.js). Remove it manually from Firebase Console → Authentication if needed.', 'err');
    return false;
  }
}

// Secondary app instance — used ONLY so an admin can create a new login
// (employee/customer/admin) without being signed out of their own session.
const secondaryApp = initializeApp(firebaseConfig, "secondary");
const secondaryAuth = getAuth(secondaryApp);

const LOGIN_EMAIL_DOMAIN = "pac.internal"; // synthetic email domain for ID-based logins

function $(id){ return document.getElementById(id); }

function toDate(v){ if(!v) return null; if(typeof v==='number') return new Date(v); if(v.seconds) return new Date(v.seconds*1000); const d=new Date(v); return isNaN(d)?null:d; }
function fmtDate(v){ const d=toDate(v); if(!d) return '—'; return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(v){ const d=toDate(v); if(!d) return '—'; return d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function fmtBytes(n){ if(!n) return '0 KB'; const k=1024; const sizes=['B','KB','MB','GB']; const i=Math.floor(Math.log(n)/Math.log(k)); return (n/Math.pow(k,i)).toFixed(1)+' '+sizes[i]; }

  const wrap = $('toastWrap');

  wrap.appendChild(el);

/* ============================================================

const state = {

  notifications: {},        // notifId -> {audience, title, body, type, createdAt, readBy}
  route: 'dashboard',
  routeParams: {},
  listenersBound: false
};

function isAdmin(){ return state.profile?.role === 'admin'; }        // "Manager" in the UI
function isSubManager(){ return state.profile?.role === 'submanager'; }
function isEmployee(){ return state.profile?.role === 'employee'; }
function isCustomer(){ return state.profile?.role === 'customer'; }
function isInternalStaff(){ return isAdmin() || isSubManager() || isEmployee(); }
// Only Managers and Sub-Managers can create/assign tasks to Employees.

function myCustomerIds(){
  // Managers, Sub-Managers and Employees all share full visibility into
  // every customer (customers added by any employee are visible to the
  // whole internal team) — assignment (employeeIds) is now informational
  // rather than an access gate.
  if(isAdmin() || isSubManager() || isEmployee()) return Object.keys(state.customers);
  if(isCustomer()) return state.profile.customerId ? [state.profile.customerId] : [];
  return [];
}
function visibleTasks(){

}
function visibleDocuments(){

  return Object.values(state.documents).filter(d=>ids.has(d.customerId));
}

window.doLogin = async function(){
  const id = $('loginId').value.trim();
  const pass = $('loginPass').value;
  if(!id || !pass){ renderLogin('Enter your login ID and password.'); return; }
  const btn=$('loginBtn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> Signing in…';
  try{
    const snap = await dbGet(dbRef(rtdb, 'usernames/'+id.trim().toLowerCase()));
    if(!snap.exists()){ renderLogin('That login ID was not found.'); return; }
    const { email } = snap.val();
    await signInWithEmailAndPassword(auth, email, pass);
  }catch(e){
    btn.disabled=false; btn.innerHTML='Sign in';
    renderLogin(friendlyAuthError(e));
  }
};

function friendlyAuthError(e){
  const code = e?.code || '';
  if(code.includes('wrong-password') || code.includes('invalid-credential')) return 'Incorrect ID or password.';
  if(code.includes('user-not-found')) return 'That login ID was not found.';
  if(code.includes('too-many-requests')) return 'Too many attempts — please wait a moment and try again.';
  if(code.includes('network')) return 'Network error — check your connection.';
  if(code.includes('email-already-in-use')) return 'That login ID already has a login account. If a previous attempt with this ID failed partway, pick a different Login ID and try again.';
  if(code.includes('weak-password')) return 'Password must be at least 6 characters.';
  if(code.includes('permission-denied') || code.includes('PERMISSION_DENIED')) return 'Permission denied by the database rules — make sure you are logged in as an admin account.';
  return (e?.message || 'Something went wrong.') + (code ? ` (${code})` : '');
}

/* ============================================================
   DATA LISTENERS
   ============================================================ */
function bindListeners(){
  if(state.listenersBound) return;
  state.listenersBound = true;

  if(isAdmin() || isSubManager() || isEmployee()){
    onValue(dbRef(rtdb,'users'), snap=>{
      const val = snap.val() || {};
      Object.keys(val).forEach(k=>{ val[k].uid = k; }); // DB records don't store their own uid — inject it from the key
      state.users = val; renderApp();
    });
  } else {
    state.users[state.fbUser.uid] = state.profile;
  }

  if(isAdmin() || isSubManager() || isEmployee()){
    onValue(dbRef(rtdb,'customers'), snap=>{ state.customers = snap.val() || {}; renderApp(); });
  } else if(isCustomer() && state.profile.customerId){
    onValue(dbRef(rtdb,'customers/'+state.profile.customerId), snap=>{
      state.customers = snap.exists() ? {[state.profile.customerId]: snap.val()} : {};
      renderApp();
    });
  }

  if(isAdmin()){
    onValue(dbRef(rtdb,'auditLog'), snap=>{ state.auditLog = snap.val() || {}; renderApp(); });
    onValue(dbRef(rtdb,'tasksByCustomer'), snap=>{
      const val = snap.val() || {};
      const flat = {};
      Object.values(val).forEach(byCust=>Object.values(byCust||{}).forEach(t=>{ flat[t.id]=t; }));
      state.tasks = flat; renderApp();
    });
    onValue(dbRef(rtdb,'documentsByCustomer'), snap=>{
      const val = snap.val() || {};
      const flat = {};
      Object.values(val).forEach(byCust=>Object.values(byCust||{}).forEach(d=>{ flat[d.id]=d; }));
      state.documents = flat; renderApp();
    });
  } else {
    // employee or customer: subscribe per relevant customerId
    watchCustomerScopedData();
  }
}

const boundCustomerNodes = new Set();
function watchCustomerScopedData(){
  const ids = myCustomerIds();
  ids.forEach(cid=>{
    if(boundCustomerNodes.has(cid)) return;
    boundCustomerNodes.add(cid);
    onValue(dbRef(rtdb,'tasksByCustomer/'+cid), snap=>{
      const val = snap.val() || {};
      Object.keys(state.tasks).forEach(k=>{ if(state.tasks[k].customerId===cid) delete state.tasks[k]; });
      Object.values(val).forEach(t=>{ state.tasks[t.id]=t; });
      renderApp();
    });
    onValue(dbRef(rtdb,'documentsByCustomer/'+cid), snap=>{
      const val = snap.val() || {};
      Object.keys(state.documents).forEach(k=>{ if(state.documents[k].customerId===cid) delete state.documents[k]; });
      Object.values(val).forEach(d=>{ state.documents[d.id]=d; });
      renderApp();
    });
  });
}

/* ============================================================
   NOTIFICATIONS
   In-app notification center. Every record has an "audience" —
   "staff" (Managers/Sub-Managers/Employees) or "customer_<id>" (that one
   customer) — and a per-user readBy map so unread counts are personal even
   though the underlying record is shared. This gives "notify the whole
   team" and "notify this customer" for free from a single write.
   ============================================================ */
let notifUnsub = null;
let notifPanelOpen = false;

async function pushNotification(audience, title, body, type, refType, refId){
  try{
    await dbSet(dbRef(rtdb,'notifications/'+uid('n')), {
      audience, title, body: body||'', type: type||'info',
      refType: refType||null, refId: refId||null,
      createdAt: Date.now(), readBy: {}
    });
  }catch(e){ /* non-fatal */ }
}

function myNotifications(){
  if(!state.profile) return [];
  const audience = isCustomer() ? ('customer_'+state.profile.customerId) : 'staff';
  return Object.values(state.notifications||{})
    .filter(n=>n.audience===audience)
    .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
}
function unreadNotifCount(){
  if(!state.fbUser) return 0;
  return myNotifications().filter(n=>!(n.readBy||{})[state.fbUser.uid]).length;
}

function renderNotifBadge(){
  const dot = $('notifDot'); if(!dot) return;
  const n = unreadNotifCount();
  dot.style.display = n>0 ? 'flex' : 'none';
  dot.textContent = n>9 ? '9+' : String(n);
  if(notifPanelOpen) renderNotifPanel();
}

function timeAgo(ts){
  if(!ts) return '—';
  const diff = Date.now()-ts, m=Math.floor(diff/60000), h=Math.floor(diff/3600000), d=Math.floor(diff/86400000);
  if(m<1) return 'just now';
  if(m<60) return m+'m ago';
  if(h<24) return h+'h ago';
  if(d<7) return d+'d ago';
  return fmtDate(ts);
}
const NOTIF_TYPE_ICON = { document:'documents', task:'tasks', expiry:'clock', info:'bell' };

function renderNotifPanel(){
  const list = $('notifPanel'); if(!list) return;
  if(!notifPanelOpen){ list.innerHTML=''; return; }
  const items = myNotifications().slice(0,40);
  list.innerHTML = `
    <div class="notif-panel">
      <div class="notif-head"><h4>Notifications</h4>${items.length?`<span class="badge badge-new" style="cursor:pointer;" onclick="markAllNotifsRead()">Mark all read</span>`:''}</div>
      ${items.length===0?`<div class="notif-empty">You're all caught up.</div>`:items.map(n=>{
        const unread = !(n.readBy||{})[state.fbUser.uid];
        return `<div class="notif-item ${unread?'unread':''}" onclick="openNotif('${n.id||''}','${n.refType||''}','${n.refId||''}')">
          <div class="notif-ic">${PAC_ICONS[NOTIF_TYPE_ICON[n.type]||'bell']}</div>
          <div><div class="notif-text"><strong>${esc(n.title)}</strong>${n.body?' — '+esc(n.body):''}</div><div class="notif-time">${timeAgo(n.createdAt)}</div></div>
        </div>`;
      }).join('')}
    </div>
  `;
}

window.toggleNotifPanel = function(){
  notifPanelOpen = !notifPanelOpen;
  renderNotifPanel();
};

window.markAllNotifsRead = async function(){
  const updates = {};
  myNotifications().forEach(n=>{ if(!(n.readBy||{})[state.fbUser.uid]) updates[`notifications/${n.id}/readBy/${state.fbUser.uid}`] = true; });
  if(Object.keys(updates).length===0) return;
  try{ await dbUpdate(dbRef(rtdb), updates); }catch(e){}
};

window.openNotif = async function(notifId, refType, refId){
  if(notifId){
    try{ await dbUpdate(dbRef(rtdb,'notifications/'+notifId+'/readBy'), { [state.fbUser.uid]: true }); }catch(e){}
  }
  notifPanelOpen = false; renderNotifPanel();
  if(refType==='task' && refId){ goto(isCustomer()?'requests':'tasks', {type:'task', id:refId}); }
  else if(refType==='document' && refId){ goto(isCustomer()?'c_documents':'documents'); }
};

// Keys every distinct notification with a stable id — dbSet on a fixed key
// is idempotent, so calling this repeatedly (e.g. every reload) never spams.
function pushNotificationOnce(fixedId, audience, title, body, type, refType, refId){
  if((state.notifications||{})[fixedId]) return Promise.resolve();
  return dbSet(dbRef(rtdb,'notifications/'+fixedId), {
    audience, title, body: body||'', type: type||'info',
    refType: refType||null, refId: refId||null,
    createdAt: Date.now(), readBy: {}
  }).catch(()=>{});
}

const EXPIRY_WARN_MS = 15*24*60*60*1000; // notify from 15 days out
function checkExpiries(){
  if(!isAdmin()) return; // only the Manager's client writes these, to avoid write storms
  const now = Date.now();
  Object.values(state.documents||{}).forEach(d=>{
    if(!d.expiryDate) return;
    const exp = toDate(d.expiryDate); if(!exp) return;
    const diffMs = exp.getTime()-now;
    if(diffMs<=0 || diffMs>EXPIRY_WARN_MS) return;
    const daysLeft = Math.max(1, Math.ceil(diffMs/86400000));
    const cust = getCustomer(d.customerId);
    const title = `"${d.name}" expires in ${daysLeft} day${daysLeft===1?'':'s'}`;
    pushNotificationOnce('expiry_'+d.id+'_staff', 'staff', title, cust?`For ${cust.name}.`:'', 'expiry', 'document', d.id);
    if(d.customerId) pushNotificationOnce('expiry_'+d.id+'_customer', 'customer_'+d.customerId, title, 'Please renew this document soon.', 'expiry', 'document', d.id);
  });
}

function bindNotifications(){
  if(notifUnsub) return;
  const wrap = $('notifWrap'); if(wrap) wrap.style.display = 'flex';
  onValue(dbRef(rtdb,'notifications'), snap=>{
    state.notifications = snap.val() || {};
    Object.keys(state.notifications).forEach(k=>{ state.notifications[k].id = k; });
    renderNotifBadge();
    setTimeout(checkExpiries, 1500);
  });
  notifUnsub = true;
  setInterval(checkExpiries, 6*60*60*1000);
  document.addEventListener('click', (e)=>{
    if(notifPanelOpen && !e.target.closest('#notifWrap')){ notifPanelOpen=false; renderNotifPanel(); }
  });
}
function unbindNotifications(){
  notifUnsub = null; notifPanelOpen = false;
  const wrap = $('notifWrap'); if(wrap) wrap.style.display = 'none';
  const dot = $('notifDot'); if(dot) dot.style.display = 'none';
}

   AUTH STATE
   ============================================================ */
async function handleAuthUser(user){
  if(!user){
    state.fbUser=null; state.profile=null; state.listenersBound=false; boundCustomerNodes.clear();
    unbindNotifications();
    $('app').style.display='none';
    $('authScreen').style.display='flex';
    renderAuth();
    return;
  }
  try{
    const snap = await dbGet(dbRef(rtdb,'users/'+user.uid));
    if(!snap.exists()){
      toast('Your account has no profile on record. Contact your manager.','err');
      await signOut(auth); return;
    }
    const profile = snap.val();
    if(profile.status==='inactive'){
      toast('This account has been disabled. Contact your manager.','err');
      await signOut(auth); return;
    }
    state.fbUser = user;
    state.profile = { ...profile, uid:user.uid };
    $('authScreen').style.display='none';
    $('app').style.display='flex';
    state.route = defaultRouteFor(state.profile.role);
    applyThemeFromProfile(profile.themePreference); // ⬅️ الثيم المحفوظ بتاع اليوزر ده
    bindListeners();
    bindNotifications();
    renderApp();
  }catch(e){
    toast('Could not load your profile: '+e.message,'err');
  }
}

onAuthStateChanged(auth, async (user)=>{
  if(bootstrapping) return; // تجاهل أي حدث تسجيل دخول لحد ما نخلص كتابة بروفايل الأدمن
  $('bootScreen').style.display='none';
  await handleAuthUser(user);
});

function defaultRouteFor(role){

/* ============================================================
   THEME (saved on Firebase per-account, falls back to localStorage
   pre-login so the auth screen isn't stuck in the wrong theme)
   ============================================================ */
const THEMES = [
  {key:'dark',   label:'Dark',            dot:'#4C82F2', dot2:'#8A6BFB', bg:'#0B1220'},
  {key:'light',  label:'Light',           dot:'#48566B', dot2:'#6B7A90', bg:'#F2F4FA'},
  {key:'blue',   label:'Blue (Default)',  dot:'#3654CE', dot2:'#4C82F2', bg:'#F2F4FA'},
  {key:'orange', label:'Orange',          dot:'#D9790C', dot2:'#F2A238', bg:'#F2F4FA'},
  {key:'red',    label:'Red',             dot:'#D63A57', dot2:'#EC6B84', bg:'#F2F4FA'},
  {key:'yellow', label:'Yellow',          dot:'#B4841C', dot2:'#DBA847', bg:'#F2F4FA'},
  {key:'green',  label:'Green',           dot:'#12996F', dot2:'#2FBB93', bg:'#F2F4FA'},
];
const THEME_KEYS = THEMES.map(t=>t.key);

function applyThemeFromProfile(themePreference){
  const t = THEME_KEYS.includes(themePreference) ? themePreference : 'blue';
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('pac-theme', t); }catch(e){}
  window.setThemeIcon && window.setThemeIcon();
}

// Full theme picker — used by the Settings tab swatches. Saves per-account
// so the choice follows the person to any device they log in from.
window.setTheme = async function(name){
  if(!THEME_KEYS.includes(name)) return;
  document.documentElement.setAttribute('data-theme', name);
  try{ localStorage.setItem('pac-theme', name); }catch(e){}
  window.setThemeIcon && window.setThemeIcon();
  if(state.fbUser && state.profile){
    state.profile.themePreference = name; // تحديث محلي فوري
    try{
      await dbUpdate(dbRef(rtdb,'users/'+state.fbUser.uid), { themePreference: name });
    }catch(e){
      toast('Could not save theme preference: '+e.message, 'err');
    }
  }
  if(state.route==='settings') renderApp(); // refresh active-swatch state
};

// Quick one-tap toggle (top-right floating button) — flips between Dark
// and whatever light-family theme was last active, without needing to
// open Settings. Fine-grained color choice lives in the Settings tab.
window.toggleTheme = async function(){
  const cur = document.documentElement.getAttribute('data-theme') || 'blue';
  const next = cur === 'dark' ? (state.profile?.themePreference && state.profile.themePreference!=='dark' ? state.profile.themePreference : 'blue') : 'dark';
  await window.setTheme(next);
};

const ICONS = {

function navFor(role){
  // Manager (role id "admin") sees every tab that exists across all roles —
  // dashboard, customers, team, tasks, documents, reports, client requests,
  // the audit trail, and settings.
  if(role==='admin') return [
    {key:'dashboard', label:'Dashboard'},
    {key:'customers', label:'Customers'},
    {key:'employees', label:'Team'},
    {key:'tasks', label:'Tasks'},
    {key:'documents', label:'Documents'},
    {key:'requests', label:'Client Requests'},
    {key:'reports', label:'Reports'},
    {key:'audit', label:'Audit Log'},
    {key:'settings', label:'Settings'},
  ];
  // Sub-Manager: identical surface to Employee, but can assign tasks
  // (permission-gated inside the Tasks pages, not a separate tab).
  if(role==='submanager' || role==='employee') return [
    {key:'dashboard', label:'Dashboard'},
    {key:'customers', label:'Customers'},
    {key:'tasks', label:'Tasks'},
    {key:'documents', label:'Documents'},
    {key:'reports', label:'Reports'},
    {key:'settings', label:'Settings'},
  ];
  return [ // customer
    {key:'c_dashboard', label:'Dashboard'},
    {key:'c_profile', label:'My Details'},
    {key:'c_documents', label:'My Documents'},
    {key:'requests', label:'My Requests'},
    {key:'settings', label:'Settings'},
  ];
}

        </div>
        <button class="btn btn-ghost btn-sm sb-signout" onclick="doSignOut()">Sign out</button>
      </div>
    </div>
    <div class="main" id="mainView"></div>
  `;
  $('mainView').innerHTML = renderRoute();
}

function renderRoute(){
  const r = state.route, p = state.routeParams;
  try{
    if(p.type==='customer' && r==='customers') return viewCustomerDetail(p.id);
    if(p.type==='user' && r==='employees') return viewUserDetail(p.id);
    if(p.type==='task' && (r==='tasks' || r==='requests')) return viewTaskDetail(p.id);

    switch(r){
      case 'dashboard': return viewAdminEmployeeDashboard();
      case 'customers': return viewCustomers();
      case 'employees': return viewEmployees();
      case 'tasks': return viewTasks();
      case 'documents': return viewDocuments();
      case 'reports': return viewReports();
      case 'audit': return viewAudit();
      case 'c_dashboard': return viewCustomerDashboard();
      case 'c_profile': return viewCustomerProfile();
      case 'c_documents': return viewCustomerDocuments();
      case 'requests': return viewRequests();
      case 'settings': return viewSettings();
      default: return `<div class="empty-state">Not found.</div>`;
    }
  }catch(e){
    console.error(e);
    return `<div class="empty-state">Something went wrong rendering this page.<br><span class="mono" style="font-size:11px;">${esc(e.message)}</span></div>`;
  }
}

// Compact, dependency-free stacked-bar "chart" of where every task sits in
// the workflow — avoids pulling in a charting library for one small view.
function pipelineChart(tasks){
  const buckets = [...WORKFLOW_STEPS.map(s=>({key:s.key,label:s.label})), {key:'REJECTED',label:'Rejected'}];
  const colors = ['#8C96B4','#3E7BFA','#7C5CFA','#C9820F','#0EA88C','#0EA88C','#E23B54'];
  const counts = buckets.map(b=>tasks.filter(t=>t.status===b.key).length);
  const total = counts.reduce((a,b)=>a+b,0) || 1;
  return `
    <div style="display:flex;height:14px;border-radius:8px;overflow:hidden;margin-bottom:14px;">
      ${counts.map((n,i)=>n?`<div style="flex:${n};background:${colors[i]};" title="${buckets[i].label}: ${n}"></div>`:'').join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;">
      ${buckets.map((b,i)=>counts[i]?`
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);">
          <span style="width:9px;height:9px;border-radius:3px;background:${colors[i]};flex:none;"></span>
          ${b.label} <strong style="margin-left:auto;color:var(--ink);">${counts[i]}</strong>
        </div>`:'').join('')}
    </div>
    ${total<=1 && counts.reduce((a,b)=>a+b,0)===0 ? `<div class="empty-state" style="padding:14px 0;">No tasks yet.</div>` : ''}
  `;
}

// Shared by both dashboards — lists documents expiring within 45 days,
// flagging the ≤15-day ones (the same threshold that triggers notifications).
function expiringSoonList(docs){
  const now = Date.now();
  const items = docs.filter(d=>d.expiryDate).map(d=>{
    const exp = toDate(d.expiryDate);
    return exp ? { d, daysLeft: Math.ceil((exp.getTime()-now)/86400000) } : null;
  }).filter(x=>x && x.daysLeft<=45).sort((a,b)=>a.daysLeft-b.daysLeft).slice(0,6);
  if(items.length===0) return `<div class="empty-state" style="padding:14px 0;">Nothing expiring soon.</div>`;
  return items.map(({d,daysLeft})=>`
    <div class="expiry-item">
      <div class="notif-ic">${PAC_ICONS.clock}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-weight:700;font-size:12.5px;">${esc(d.name)}</div>
        <div style="font-size:11px;color:var(--ink-faint);">${esc(getCustomer(d.customerId)?.name||'—')}</div>
      </div>
      <span class="expiry-badge ${daysLeft<=15?'soon':'upcoming'}">${daysLeft<0?'Expired':daysLeft+'d left'}</span>
    </div>
  `).join('');
}

// Renders the extended fields as a collapsible accordion so the base form
// stays quick to fill while every client-master column still has a home.
function renderCustomerExtraFields(c){
  const data = (c && c.accountingInfo) || {};
  return CUSTOMER_EXTRA_FIELD_GROUPS.map(g=>{
    const filled = g.fields.filter(f=>(data[f.key]||'').toString().trim()!=='').length;
    return `
    <details class="cf-details">
      <summary>${esc(g.title)}${filled?`<span class="cf-details-count">${filled} filled</span>`:''}</summary>
      <div class="cf-details-body grid-2">
        ${g.fields.map(f=>{
          const val = esc(data[f.key]||'');
          if(f.type==='textarea'){
            return `<div class="field" style="grid-column:1/-1;"><label>${esc(f.label)}</label><textarea id="cfx_${f.key}">${val}</textarea></div>`;
          }
          return `<div class="field"><label>${esc(f.label)}</label><input id="cfx_${f.key}" type="${f.type==='date'?'date':'text'}" value="${val}"></div>`;
        }).join('')}
      </div>
    </details>`;
  }).join('');
}

function nextCustomerLoginId(){
  const nums = Object.values(state.users||{}).map(u=>u.id).filter(id=>/^C\d+$/.test(id||'')).map(id=>parseInt(id.slice(1),10));
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return 'C' + String(next).padStart(3,'0');
}

function expiryBadge(d){
  if(!d.expiryDate) return '';
  const exp = toDate(d.expiryDate); if(!exp) return '';
  const daysLeft = Math.ceil((exp.getTime()-Date.now())/86400000);
  if(daysLeft<0) return `<span class="expiry-badge soon">Expired</span>`;
  if(daysLeft<=15) return `<span class="expiry-badge soon">${daysLeft}d left</span>`;
  if(daysLeft<=45) return `<span class="expiry-badge upcoming">${daysLeft}d left</span>`;
  return '';
}

window.saveCustomer = async function(id){
  const name = $('cfName').value.trim();
  if(!name){ toast('Company name is required.','err'); return; }

  const systemType = $('cfSystemType')?.value || 'none';
  const sysEmail = $('cfSysEmail')?.value.trim() || '';
  const sysPass = $('cfSysPass')?.value.trim() || '';
  if(systemType!=='none' && (!sysEmail || !sysPass)){
    toast('Email and password are required for the selected System.','err'); return;
  }

  const employeeIds = {};
  document.querySelectorAll('.cfEmpChk').forEach(chk=>{ if(chk.checked) employeeIds[chk.value] = true; });

  const accountingInfo = {};
  CUSTOMER_EXTRA_FIELD_GROUPS.forEach(g=>g.fields.forEach(f=>{
    const el = $('cfx_'+f.key);
    if(el) accountingInfo[f.key] = el.value.trim();
  }));

  const payload = {
    name, contactPerson:$('cfContact').value.trim(), email:$('cfEmail').value.trim(),
    phone:$('cfPhone').value.trim(), taxId:$('cfTax').value.trim(), industry:$('cfIndustry').value.trim(),
    address:$('cfAddress').value.trim(), notes:$('cfNotes').value.trim(), status:$('cfStatus').value,
    systemType, systemEmail: systemType==='none'?'':sysEmail, systemPassword: systemType==='none'?'':sysPass,
    accountingInfo
  };
  const btn=$('cfSubmit'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> Saving…';
  try{
    if(id){
      await dbUpdate(dbRef(rtdb,'customers/'+id), { ...payload, employeeIds });
      state.customers[id] = { ...state.customers[id], ...payload, employeeIds }; // تحديث فوري محلي
      await pushAudit('Updated customer', name);
      toast('Customer updated.'); closeModal(); goto('customers',{type:'customer',id});
      return;
    }
    // NEW customer: create record + auto-create customer login
    const loginId = ($('cfLoginId').value||'').trim().toLowerCase();
    const pass = $('cfPass').value;
    if(!loginId){ toast('Login ID is required.','err'); btn.disabled=false; btn.innerHTML='Create customer'; return; }
    if(pass.length<6){ toast('Temporary password must be at least 6 characters.','err'); btn.disabled=false; btn.innerHTML='Create customer'; return; }
    const existing = await dbGet(dbRef(rtdb,'usernames/'+loginId));
    if(existing.exists()){ toast('That login ID is already taken.','err'); btn.disabled=false; btn.innerHTML='Create customer'; return; }

    const customerId = uid('cust');
    const email = idToEmail(loginId);
    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, pass);
    const newUid = cred.user.uid;
    await signOut(secondaryAuth);

    const newCustomerRecord = { ...payload, id:customerId, loginId, userId:newUid, employeeIds, createdAt: Date.now() };
    await dbSet(dbRef(rtdb,'usernames/'+loginId), { email, uid:newUid, role:'customer' });
    await dbSet(dbRef(rtdb,'users/'+newUid), { id:loginId, name:payload.contactPerson||name, role:'customer', status:'active', customerId, uid:newUid, createdAt: Date.now() });
    await dbSet(dbRef(rtdb,'customers/'+customerId), newCustomerRecord);
    state.customers[customerId] = newCustomerRecord; // تحديث فوري محلي — عشان يبان فورًا من غير ما نستنى الـ listener
    state.users[newUid] = { id:loginId, name:payload.contactPerson||name, role:'customer', status:'active', customerId, uid:newUid };
    await pushAudit('Created customer', `${name} (login #${loginId})`);
    toast(`Customer created. Portal login: #${loginId}`);
    closeModal(); goto('customers',{type:'customer',id:customerId});
  }catch(e){
    console.error('saveCustomer failed:', e);
    btn.disabled=false; btn.innerHTML=id?'Save changes':'Create customer';
    toast('Could not save customer: '+friendlyAuthError(e), 'err');
  }
};

window.deleteCustomer = async function(customerId){
  if(!isAdmin()){ toast('Only Managers can delete customers.','err'); return; }
  const c = getCustomer(customerId);
  if(!c) return;
  const taskCount = Object.values(state.tasks).filter(t=>t.customerId===customerId).length;
  const docCount = Object.values(state.documents).filter(d=>d.customerId===customerId).length;
  if(!confirm(`Delete customer "${c.name}" (#${c.loginId||'—'})?\n\nThis permanently removes their portal login, ${taskCount} task(s), and ${docCount} document(s). This cannot be undone.`)) return;
  try{
    // 0) delete the Authentication account itself (via Cloud Function) so the
    //    Login ID becomes fully reusable for a different customer afterwards
    if(c.userId) await deleteAuthAccount(c.userId);
    // 1) remove the customer's portal login record
    if(c.loginId) await dbRemove(dbRef(rtdb,'usernames/'+c.loginId));
    if(c.userId) await dbRemove(dbRef(rtdb,'users/'+c.userId));
    // 2) remove related data
    await dbRemove(dbRef(rtdb,'tasksByCustomer/'+customerId));
    await dbRemove(dbRef(rtdb,'documentsByCustomer/'+customerId));
    await dbRemove(dbRef(rtdb,'files/'+customerId));
    // 3) remove the customer record itself
    await dbRemove(dbRef(rtdb,'customers/'+customerId));

    // optimistic local cleanup so it disappears immediately
    delete state.customers[customerId];
    if(c.userId) delete state.users[c.userId];
    Object.keys(state.tasks).forEach(k=>{ if(state.tasks[k].customerId===customerId) delete state.tasks[k]; });
    Object.keys(state.documents).forEach(k=>{ if(state.documents[k].customerId===customerId) delete state.documents[k]; });

    await pushAudit('Deleted customer', `${c.name} (#${c.loginId||'—'})`);
    toast('Customer deleted.');
    goto('customers');
  }catch(e){ console.error('deleteCustomer failed:', e); toast('Could not delete customer: '+e.message,'err'); }
};

window.saveEmployee = async function(uidVal){
  const name = $('efName').value.trim();
  if(!name){ toast('Full name is required.','err'); return; }
  const status = $('efStatus').value;
  const btn=$('efSubmit'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> Saving…';
  try{
    if(uidVal){
      await dbUpdate(dbRef(rtdb,'users/'+uidVal), { name, status });
      state.users[uidVal] = { ...state.users[uidVal], name, status };
      await pushAudit('Updated account', name);
      toast('Account updated.'); closeModal(); goto('employees',{type:'user',id:uidVal});
      return;
    }
    const role = $('efRole').value;
    const loginId = ($('efLoginId').value||'').trim().toLowerCase();
    const pass = $('efPass').value;
    if(!loginId){ toast('Login ID is required.','err'); btn.disabled=false; btn.innerHTML='Create account'; return; }
    if(loginId==='001'){ toast('Login ID #001 is reserved for the founding admin.','err'); btn.disabled=false; btn.innerHTML='Create account'; return; }
    if(pass.length<6){ toast('Password must be at least 6 characters.','err'); btn.disabled=false; btn.innerHTML='Create account'; return; }
    const existing = await dbGet(dbRef(rtdb,'usernames/'+loginId));
    if(existing.exists()){ toast('That login ID is already taken.','err'); btn.disabled=false; btn.innerHTML='Create account'; return; }

    const email = idToEmail(loginId);
    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, pass);
    const newUid = cred.user.uid;
    await signOut(secondaryAuth);

    const newUserRecord = { id:loginId, name, role, status:'active', customerId:null, createdAt: Date.now(), uid:newUid };
    await dbSet(dbRef(rtdb,'usernames/'+loginId), { email, uid:newUid, role });
    await dbSet(dbRef(rtdb,'users/'+newUid), { id:loginId, name, role, status:'active', customerId:null, uid:newUid, createdAt: Date.now() });
    state.users[newUid] = newUserRecord; // تحديث فوري محلي
    await pushAudit('Created account', `${name} (#${loginId}, ${role})`);
    toast(`Account created. Login ID: #${loginId}`);
    closeModal(); goto('employees',{type:'user',id:newUid});
  }catch(e){
    console.error('saveEmployee failed:', e);
    btn.disabled=false; btn.innerHTML=uidVal?'Save changes':'Create account';
    toast('Could not save account: '+friendlyAuthError(e), 'err');
  }
};

window.setUserStatus = async function(uidVal, status){
  try{
    await dbUpdate(dbRef(rtdb,'users/'+uidVal), { status });
    await pushAudit(status==='active'?'Reactivated account':'Disabled account', getUserById(uidVal)?.name);
    toast(status==='active'?'Account reactivated.':'Account disabled.');
  }catch(e){ toast('Could not update account: '+e.message,'err'); }
};
window.deleteAccount = async function(uidVal){
  const u = getUserById(uidVal);
  if(!u || u.role==='admin') return;
  if(!confirm(`Delete ${u.role} account "${u.name}" (#${u.id})? This also removes their Authentication login so the ID (#${u.id}) can be reused later. This cannot be undone.`)) return;
  try{
    await deleteAuthAccount(uidVal); // removes the actual login from Firebase Authentication
    await dbRemove(dbRef(rtdb,'users/'+uidVal));
    await dbRemove(dbRef(rtdb,'usernames/'+u.id));
    for(const c of Object.values(state.customers)){
      if((c.employeeIds||{})[uidVal]) await dbRemove(dbRef(rtdb,`customers/${c.id}/employeeIds/${uidVal}`));
    }
    delete state.users[uidVal]; // تحديث فوري محلي
    await pushAudit('Deleted account', u.name);
    toast('Account removed.'); goto('employees');
  }catch(e){ console.error('deleteAccount failed:', e); toast('Could not delete account: '+e.message,'err'); }
};

const WORKFLOW_STEPS = [
  {key:'ASSIGNED', label:'Assigned'}, {key:'IN_PROGRESS', label:'In progress'},
  {key:'READY_FOR_REVIEW', label:'Docs submitted'}, {key:'UNDER_REVIEW', label:'Under review'},
  {key:'APPROVED', label:'Approved'}, {key:'COMPLETED', label:'Completed'},
];
function taskProgress(t){ const idx=WORKFLOW_STEPS.findIndex(s=>s.key===t.status); return Math.max(0,Math.min(100,Math.round(((idx+1)/WORKFLOW_STEPS.length)*100))); }

window.createTask = async function(){
  const title = $('tfTitle').value.trim();
  const customerId = $('tfCustomer').value;
  if(!title || !customerId){ toast('Title and customer are required.','err'); return; }
  const btn=$('tfSubmit'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> Creating…';
  try{
    const taskId = uid('task');
    const assignedTo = $('tfAssignee').value || null;
    await dbSet(dbRef(rtdb,`tasksByCustomer/${customerId}/${taskId}`), {
      id:taskId, customerId, title, description:$('tfDesc').value.trim(), assignedTo,
      priority:$('tfPriority').value, dueDate:$('tfDue').value?new Date($('tfDue').value).getTime():null,
      cost:Number($('tfCost').value||0), status:'ASSIGNED', isRequest:false,
      createdBy: state.profile.name, createdByUid: state.fbUser.uid, createdAt: Date.now(), notes:[]
    });
    // Assigning a task to an employee also grants them access to this customer
    // (task/document visibility is scoped by customer team membership)
    if(assignedTo && !(getCustomer(customerId)?.employeeIds||{})[assignedTo]){
      await dbUpdate(dbRef(rtdb,`customers/${customerId}/employeeIds`), { [assignedTo]: true });
      if(state.customers[customerId]) state.customers[customerId].employeeIds = { ...(state.customers[customerId].employeeIds||{}), [assignedTo]: true };
    }
    await pushAudit('Created task', title);
    toast('Task created.'); closeModal(); goto('tasks',{type:'task',id:taskId});
  }catch(e){ btn.disabled=false; btn.innerHTML='Create task'; toast('Could not create task: '+e.message,'err'); }
};

window.createRequest = async function(){
  const title = $('rfTitle').value.trim();
  if(!title){ toast('Please describe what you need.','err'); return; }
  const btn=$('rfSubmit'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> Sending…';
  try{
    const customerId = state.profile.customerId;
    const c = getCustomer(customerId);
    const taskId = uid('req');
    await dbSet(dbRef(rtdb,`tasksByCustomer/${customerId}/${taskId}`), {
      id:taskId, customerId, title, description:$('rfDesc').value.trim(), assignedTo: Object.keys(c?.employeeIds||{})[0]||null,
      priority:'medium', dueDate:null, cost:0, status:'ASSIGNED', isRequest:true,
      createdBy: state.profile.name, createdByUid: state.fbUser.uid, createdAt: Date.now(), notes:[]
    });
    await pushAudit('Submitted request', title);
    await pushNotification('staff', `New request from ${c?.name||'a customer'}`, title, 'task', 'task', taskId);
    toast('Request sent to your team.'); closeModal(); goto('requests',{type:'task',id:taskId});
  }catch(e){ btn.disabled=false; btn.innerHTML='Submit request'; toast('Could not submit request: '+e.message,'err'); }
};

window.updateTask = async function(id){
  const t = getTask(id); if(!t) return;
  const status = $('tuStatus').value;
  const assignedTo = $('tuAssignee') ? ($('tuAssignee').value||null) : t.assignedTo;
  const noteText = $('tuNote')?.value.trim();
  const newCost = $('tuCost') ? Number($('tuCost').value||0) : t.cost;
  const updates = { status, assignedTo, cost:newCost };
  if(noteText){ updates.notes = [...(t.notes||[]), { text:noteText, by:state.profile.name, date:Date.now() }]; }
  try{
    // Assigning a task to an employee also grants them access to this customer
    // (task/document visibility is scoped by customer team membership)
    if(assignedTo && !(getCustomer(t.customerId)?.employeeIds||{})[assignedTo]){
      await dbUpdate(dbRef(rtdb,`customers/${t.customerId}/employeeIds`), { [assignedTo]: true });
      if(state.customers[t.customerId]) state.customers[t.customerId].employeeIds = { ...(state.customers[t.customerId].employeeIds||{}), [assignedTo]: true };
    }
    await dbUpdate(dbRef(rtdb,`tasksByCustomer/${t.customerId}/${id}`), updates);
    await pushAudit('Updated task', `${t.title} → ${status}`);
    if(t.isRequest && newCost && newCost!==t.cost && t.customerId){
      pushNotification('customer_'+t.customerId, `Cost updated for "${t.title}"`, formatCost(newCost), 'task', 'task', id);
    }
    if(t.isRequest && status!==t.status && t.customerId && isInternalStaff()){
      pushNotification('customer_'+t.customerId, `"${t.title}" is now ${status.replace(/_/g,' ').toLowerCase()}`, '', 'task', 'task', id);
    }
    toast('Task updated.'); goto(t.isRequest&&isCustomer()?'requests':'tasks',{type:'task',id});
  }catch(e){ toast('Could not update task: '+e.message,'err'); }
};

let docFilter = 'all';

  let list = visibleDocuments();
  if(docFilter==='pending') list = list.filter(d=>d.status==='pending');
  if(docFilter==='approved') list = list.filter(d=>d.status==='approved');

  return `
    <div class="topbar">
      <div><div class="eyebrow">Files</div><h2>Documents</h2><div class="topbar-sub">${list.length} file${list.length===1?'':'s'}.</div></div>
      ${isInternalStaff() ? `<div class="topbar-actions"><button class="btn btn-primary" onclick="openCustomerDocUpload()">+ Upload document</button></div>` : ''}
    </div>
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      ${[['all','All'],['pending','Pending review'],['approved','Approved']].map(([k,l])=>`
        <button class="btn ${docFilter===k?'btn-outline':'btn-ghost'} btn-sm" onclick="setDocFilter('${k}')">${l}</button>
      `).join('')}
    </div>
    <div class="panel"><div class="panel-body">${list.length===0?`<div class="empty-state">No documents match this filter.</div>`:list.map(d=>`
      <div class="doc-row">
        <div class="doc-ic">${(d.fileType||'F').slice(0,3).toUpperCase()}</div>
        <div><div class="doc-name">${esc(d.name)}</div><div class="doc-meta">${esc(getCustomer(d.customerId)?.name||'—')} · ${fmtBytes(d.fileSize)} · ${esc(d.uploadedBy)} · ${fmtDate(d.uploadDate)}${d.expiryDate?` · Expires ${fmtDate(d.expiryDate)}`:''}</div></div>
        <div class="doc-actions">
          ${expiryBadge(d)}
          ${statusPill(d.status)}
          ${d.status==='pending' && isInternalStaff() ? `<button class="btn btn-outline btn-sm" onclick="setDocStatus('${d.id}','approved')">Approve</button><button class="btn btn-danger btn-sm" onclick="rejectAndDeleteDoc('${d.id}')">Reject &amp; delete</button>`:''}
          ${d.status!=='pending' && isInternalStaff() ? `<button class="btn btn-ghost btn-sm" onclick="rejectAndDeleteDoc('${d.id}')" title="Delete this document">${PAC_ICONS.trash}</button>`:''}
          <button class="btn btn-ghost btn-sm" onclick="openStoredDoc('${d.rtdbPath}','${esc(d.name)}')">Open</button>

window.setDocFilter = function(f){ docFilter=f; renderApp(); };

// Customer-facing "My Documents" tab. Customers can now upload their own
// files here too — staff get notified the moment they do.
function viewCustomerDocuments(){
  if(!isCustomer()) return `<div class="empty-state">You don't have access to this page.</div>`;
  const list = visibleDocuments().slice().sort((a,b)=>(b.uploadDate||0)-(a.uploadDate||0));
  return `
    <div class="topbar">

      <div class="topbar-actions"><button class="btn btn-primary" onclick="openCustomerSelfUpload()">+ Upload document</button></div>
    </div>
    <div class="panel"><div class="panel-body">${list.length===0?`<div class="empty-state">No documents have been shared with you yet.</div>`:list.map(d=>docRow(d)).join('')}</div></div>

window.setDocStatus = async function(docId, status){
  const d = state.documents[docId]; if(!d) return;
  try{
    await dbUpdate(dbRef(rtdb,`documentsByCustomer/${d.customerId}/${docId}`), { status, reviewer: state.profile.name, reviewDate: Date.now() });
    await pushAudit(status==='approved'?'Approved document':'Rejected document', d.name);
    if(status==='approved' && d.customerId) pushNotification('customer_'+d.customerId, `"${d.name}" was approved`, '', 'document', 'document', null);
    toast('Document '+status+'.');
  }catch(e){ toast('Could not update document: '+e.message,'err'); }
};

// Rejecting removes the document entirely (record + stored file), per the
// team's workflow — a rejected upload isn't kept around, it's redone.
window.rejectAndDeleteDoc = async function(docId){
  if(!isInternalStaff()) return;
  const d = state.documents[docId]; if(!d) return;
  if(!confirm(`Delete "${d.name}"? This can't be undone — the customer will be notified.`)) return;
  try{
    await dbUpdate(dbRef(rtdb), {
      [`documentsByCustomer/${d.customerId}/${docId}`]: null,
      [`files/${d.customerId}/${docId}`]: null,
    });
    delete state.documents[docId];
    await pushAudit('Rejected & deleted document', d.name);
    if(d.customerId) pushNotification('customer_'+d.customerId, `"${d.name}" was rejected`, 'Please re-upload a corrected version.', 'document', 'document', null);
    toast('Document rejected and removed.');
    renderApp();
  }catch(e){ toast('Could not delete document: '+e.message,'err'); }
};

/* ============================================================
   FILE UPLOAD (Realtime Database)
   ============================================================ */
function fileToDataURL(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(new Error('Could not read the file.'));
    r.readAsDataURL(file);
  });
}

window.openTaskDocUpload = function(taskId){
  if(!isInternalStaff() && !isCustomer()){ toast('You do not have permission to upload files.','err'); return; }
  showModal(`
    <div class="modal-head"><h3>Upload document</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="upload-zone"><input type="file" id="ufFile" multiple></div>
      <div class="field"><label>Expiry date (optional)</label><input id="ufExpiry" type="date"></div>
      <div class="field-hint">Each file must be under ${(MAX_UPLOAD_BYTES/1024/1024).toFixed(0)}MB. Files are stored securely and are only visible to your assigned team and this customer. Set an expiry date for renewable documents (licenses, registrations…) to get automatic reminders.</div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="ufSubmit" onclick="uploadDoc('${taskId}')">Upload files</button></div>
  `);
};
// customerId is optional — when omitted (e.g. from the generic Documents
// tab "+ Upload document" button) the uploader picks the customer here.
// Only Managers, Sub-Managers and Employees can upload.

  showModal(`
    <div class="modal-head"><h3>Upload document</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      ${customerId ? `<div class="field-hint" style="margin-bottom:14px;">Uploading for <strong>${esc(presetName||'this customer')}</strong>.</div>` : `
        <div class="field"><label>Customer *</label><select id="ucCustomer">
          <option value="">Select a customer…</option>
          ${customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
        </select></div>
      `}
      <div class="upload-zone"><input type="file" id="ucFile" multiple></div>
      <div class="field"><label>Expiry date (optional)</label><input id="ucExpiry" type="date"></div>
      <div class="field-hint">Each file must be under ${(MAX_UPLOAD_BYTES/1024/1024).toFixed(0)}MB. The customer will see it under their My Documents tab. Set an expiry date to get automatic reminders 15 days before it lapses.</div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="ucSubmit" onclick="uploadCustomerDocs('${customerId||''}')">Upload files</button></div>
  `);
};

// Customer self-service upload — from the My Documents tab. Uploaded files
// land as "pending" (same as staff uploads) and the whole internal team
// gets notified immediately so someone reviews them.
window.openCustomerSelfUpload = function(){
  if(!isCustomer()) return;
  showModal(`
    <div class="modal-head"><h3>Upload a document</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="upload-zone"><input type="file" id="csFile" multiple></div>
      <div class="field-hint">Each file must be under ${(MAX_UPLOAD_BYTES/1024/1024).toFixed(0)}MB. Our team will be notified right away and will review it shortly.</div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="csSubmit" onclick="uploadCustomerSelfDocs()">Upload files</button></div>
  `);
};

window.uploadDoc = async function(taskId){
  const t = getTask(taskId);
  if(!t){ toast('Task not found.','err'); return; }
  const files = Array.from($('ufFile')?.files || []);
  if(!files.length){ toast('Choose at least one file.','err'); return; }
  const invalid = files.find(f=>f.size > MAX_UPLOAD_BYTES);
  if(invalid){ toast(`"${invalid.name}" is too large — keep every file under ${(MAX_UPLOAD_BYTES/1024/1024).toFixed(0)}MB.`, 'err'); return; }
  const btn = $('ufSubmit'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> Uploading…';
  const expiryDate = $('ufExpiry')?.value || null;
  try{
    for(const file of files){
      const docId = uid('doc');
      const rtdbPath = `files/${t.customerId}/${docId}`;
      await dbSet(dbRef(rtdb, rtdbPath), { dataUrl: await fileToDataURL(file) });
      await dbSet(dbRef(rtdb,`documentsByCustomer/${t.customerId}/${docId}`), {
        id:docId, taskId, customerId:t.customerId, name:file.name, fileType:(file.name.split('.').pop()||'file'),
        fileSize:file.size, rtdbPath, uploadedBy:state.profile.name, uploadedByUid:state.fbUser.uid,
        uploadDate: Date.now(), status:'pending', expiryDate: expiryDate ? new Date(expiryDate).getTime() : null
      });
      await pushAudit('Uploaded task document', file.name);
    }
    toast(`${files.length} file${files.length===1?'':'s'} uploaded.`);
    closeModal(); goto(t.isRequest&&isCustomer()?'requests':'tasks', {type:'task', id:taskId});
  }catch(e){ btn.disabled=false; btn.innerHTML='Upload files'; toast('Upload failed: '+e.message, 'err'); }
};

  if(invalid){ toast(`"${invalid.name}" is too large.`, 'err'); return; }

  const expiryDate = $('ucExpiry')?.value || null;
  try{
    for(const file of files){
      const docId = uid('doc');
      const rtdbPath = `files/${customerId}/${docId}`;

// Customer-initiated upload — notifies the whole internal team the moment

  const btn = $('csSubmit'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> Uploading…';

      const docId = uid('doc');

window.openStoredDoc = async function(rtdbPath, name){
  try{
    const snap = await dbGet(dbRef(rtdb, rtdbPath));
    if(!snap.exists()){ toast('File not found — it may have been removed.','err'); return; }
    const dataUrl = snap.val().dataUrl;
    const a = document.createElement('a');
    a.href = dataUrl; a.download = name; a.target = '_blank';
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ toast('Could not open the file: '+e.message, 'err'); }
};
